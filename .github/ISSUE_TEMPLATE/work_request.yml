name: 공통 개발 작업
description: 리팩터링, 테스트, 문서, CI/CD, 운영 정리 작업을 기록합니다.
title: "[REFACTOR] "
body:
  - type: markdown
    attributes:
      value: |
        Issue를 만들기 전에 제목 접두사를 작업 유형에 맞게 바꿔주세요.
        예: `[TEST] 테스트 설명`, `[DOCS] 문서 설명`

  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      description: 유형에 맞는 라벨이 자동으로 붙습니다.
      options:
        - REFACTOR
        - TEST
        - DOCS
        - CI
        - CHORE
        - PERF
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 무엇을 정리하거나 바꾸는가
      description: 현재 상태와 바꾸려는 내용을 짧게 적어주세요.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 작업 배경
      description: 방치했을 때 생기는 문제나, 이 작업이 필요한 이유를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: 이번에 하는 일
      description: 이 Issue 안에서 다룰 범위를 적어주세요.
      placeholder: |
        - 
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 작업을 닫기 전에 확인할 수 있는 조건을 1~3개 적어주세요.
      placeholder: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: implementation_notes
    attributes:
      label: 구현 메모 (선택)
      description: 이미 알고 있는 제약, 검토할 선택지, RFC 링크가 있으면 적어주세요.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 관련 자료 (선택)
      description: 관련 Issue, PR, ADR, RFC, 문서, 코드 경로를 적어주세요.
    validations:
      required: false
