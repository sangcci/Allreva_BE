name: 버그 리포트
description: 기대한 동작과 실제 결과가 다른 문제를 기록합니다.
labels: ["🐛 bug"]
title: "[BUG] "
body:
  - type: input
    id: summary
    attributes:
      label: 문제 요약
      description: 어떤 상황에서 무엇이 잘못되는지 한 문장으로 적어주세요.
      placeholder: KOPIS 동기화가 실패해도 배치가 성공으로 종료된다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 다른 사람이 같은 결과를 확인할 수 있도록 순서대로 적어주세요. 재현이 어렵다면 관찰한 조건을 적어주세요.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상이라면 어떤 결과가 나와야 하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 본 응답, 화면, 로그, 데이터 변화를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위 (선택)
      description: 영향을 받는 사용자, 기능, 환경이 있으면 적어주세요.
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 수정 후 무엇을 확인해야 Issue를 닫을 수 있는지 적어주세요.
      placeholder: |
        - [ ] 같은 조건에서 오류가 재현되지 않는다.
        - [ ] 회귀 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 근거 자료 (선택)
      description: 로그, 스크린샷, 대시보드, 관련 PR 또는 코드 경로를 적어주세요. 민감정보는 지워주세요.
      render: shell
    validations:
      required: false
