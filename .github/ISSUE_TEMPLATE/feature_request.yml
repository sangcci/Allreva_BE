name: 기능 또는 개선
description: 사용자 기능이나 동작 개선을 제안합니다.
labels: ["✨ feat"]
title: "[FEAT] "
body:
  - type: input
    id: summary
    attributes:
      label: 한 줄 설명
      description: 무엇을 바꾸는지 한 문장으로 적어주세요.
      placeholder: 로그인 응답에 온보딩 완료 여부를 추가한다.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 작업 배경
      description: 지금 불편한 점이나 해결하려는 문제를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: 이번에 하는 일
      description: 이 Issue 안에서 다룰 범위를 적어주세요.
      placeholder: |
        - 로그인 응답에 상태 값을 추가한다.
        - 관련 테스트를 보강한다.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 이번에는 하지 않는 일 (선택)
      description: 범위가 넓어질 수 있다면, 이번 작업에서 제외할 내용을 적어주세요.
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 작업을 닫기 전에 확인할 수 있는 조건을 1~3개 적어주세요.
      placeholder: |
        - [ ] 온보딩 완료 여부가 로그인 응답에 반환된다.
        - [ ] 관련 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: implementation_notes
    attributes:
      label: 구현 메모 (선택)
      description: 이미 알고 있는 제약, 검토할 선택지, RFC 링크가 있으면 적어주세요.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 관련 자료 (선택)
      description: 관련 Issue, PR, ADR, RFC, 문서, 코드 경로를 적어주세요.
    validations:
      required: false
